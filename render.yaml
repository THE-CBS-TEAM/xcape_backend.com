services:
  - type: web
    name: xcape-api
    env: python
    plan: free
    region: oregon
    buildCommand: "python -m pip install --upgrade pip && pip install -r requirements.txt && python manage.py migrate --noinput && python manage.py collectstatic --noinput"
    startCommand: "daphne -b 0.0.0.0 -p $PORT XCAPE.asgi:application"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: XCAPE.settings
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: "localhost,127.0.0.1,0.0.0.0,.onrender.com"
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: "https://xcape-com.onrender.com,http://localhost:3000,http://localhost:5173"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://xcape-com.onrender.com,http://localhost:3000,http://localhost:5173"
